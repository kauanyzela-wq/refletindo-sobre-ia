<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Você decide o futuro da IA</title>
<style>
:root {
--cor-fundo: #01080E;
--cor-principal: #0B0D20;
--cor-secundaria: #212333;
--cor-destaque: #2BDEFD;
--cor-texto: #D7F9FF;
}

body {
background-color: var(--cor-fundo);
color: var(--cor-texto);
font-family: Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
}

.caixa-principal {
background-color: var(--cor-principal);
width: 90%;
max-width: 600px;
text-align: center;
padding: 30px;
border-radius: 15px;
box-shadow: 0 0 15px rgba(43, 222, 253, 0.2);
}

h1 {
color: var(--cor-destaque);
}

.caixa-perguntas {
margin-bottom: 20px;
font-size: 18px;
line-height: 1.5;
}

button {
background-color: var(--cor-secundaria);
color: var(--cor-texto);
border: none;
border-radius: 10px;
padding: 15px;
margin: 8px 0;
width: 100%;
font-size: 16px;
cursor: pointer;
transition: background-color 0.3s;
}

button:hover {
background-color: var(--cor-destaque);
color: var(--cor-principal);
font-weight: bold;
}

.caixa-resultado {
display: none;
}

.caixa-resultado.mostrar {
display: block;
}

.texto-resultado {
font-size: 17px;
line-height: 1.6;
margin-bottom: 20px;
}
</style>
</head>
<body>
<div class="caixa-principal">
<h1>Você decide o futuro da IA</h1>
<div class="tela-inicial">
<p>Novembro de 2022, a humanidade se viu em uma realidade perturbadora. De repente, percebemos que as máquinas evoluíram para além do que imaginávamos. Agora elas escrevem e falam tão bem quanto humanos. E aí, como vamos lidar com essa nova realidade?</p>
<button class="iniciar-btn">Iniciar</button>
</div>
<div class="caixa-perguntas"></div>
<div class="caixa-alternativas"></div>
<div class="caixa-resultado">
<p class="texto-resultado"></p>
<button class="novamente-btn">Jogar novamente</button>
</div>
</div>

<script>
// 1. Lógica de aleatoriedade
const nomes = ["Fernanda", "Giuliana", "Maria Eduarda", "Marcelo", "Amanda", "Gustavo", "Gabriel"];

function aleatorio(lista) {
const posicao = Math.floor(Math.random() * lista.length);
return lista[posicao];
}

const nome = aleatorio(nomes);

// 2. Banco de perguntas e alternativas
const perguntas = [
{
enunciado: "Assim que saiu da escola você se depara com uma nova tecnologia, um chat que consegue responder todas as dúvidas que uma pessoa pode ter, ele também gera imagens e áudios hiper-realistas. Qual o primeiro pensamento?",
alternativas: [
{
texto: "Isso é assustador!",
afirmacao: [
"No início ficou com medo do que essa tecnologia pode fazer.",
"Achou assustador pensar na velocidade na qual a tecnologia está avançando."
],
proxima: 1,
},
{
texto: "Isso é maravilhoso!",
afirmacao: [
"Quis saber como usar IA no seu dia a dia.",
"Pensou que IA pode ajudar em tarefas da sua vida."
],
proxima: 1,
},
]
},
{
enunciado: "Com a descoberta desta tecnologia, uma professora de tecnologia da escola decidiu fazer uma sequência de aulas sobre esta tecnologia. No fim de uma aula ela pede que você escreva um trabalho sobre o uso de IA em sala de aula. Qual atitude você toma?",
alternativas: [
{
texto: "Utiliza uma ferramenta de busca na internet que utiliza IA para que ela ajude a encontrar informações relevantes para o trabalho e explique numa linguagem que facilite o entendimento.",
afirmacao: [
"Conseguiu utilizar a IA para buscar informações úteis.",
"Percebeu que a IA pode ajudar a encontrar informações úteis na internet de forma mais rápida e direcionada."
],
proxima: 2,
},
{
texto: "Escreve o trabalho com base nas conversas que teve com colegas, algumas pesquisas na internet e conhecimentos próprios sobre o tema.",
afirmacao: [
"Sentiu mais facilidade em utilizar seus próprios recursos para escrever seu trabalho.",
"Achou que era muito mais fácil procurar por respostas utilizando alguns meios mais tradicionais mesmo que levasse mais tempo."
],
proxima: 2,
},
]
},
{
enunciado: "Ao final da discussão, você precisou criar uma imagem no computador que representasse o que pensa sobre IA. E agora?",
alternativas: [
{
texto: "Criar uma imagem utilizando uma plataforma de design como o Paint.",
afirmacao: [
"Notou também que muitas pessoas não sabem ainda utilizar as ferramentas tradicionais e decidiu compartilhar seus conhecimentos de design utilizando ferramentas de pintura digital para iniciantes."
],
},
{
texto: "Criar uma imagem utilizando um gerador de imagem de IA.",
afirmacao: [
"Acelerou o processo de criação de trabalhos utilizando geradores de imagem e agora consegue ensinar pessoas que sentem dificuldades em desenhar manualmente como utilizar também!"
],
},
]
}
];

// 3. Controle do jogo e manipulação da tela
const caixaPerguntas = document.querySelector(".caixa-perguntas");
const caixaAlternativas = document.querySelector(".caixa-alternativas");
const caixaResultado = document.querySelector(".caixa-resultado");
const textoResultado = document.querySelector(".texto-resultado");
const botaoJogarNovamente = document.querySelector(".novamente-btn");
const botaoIniciar = document.querySelector(".iniciar-btn");
const telaInicial = document.querySelector(".tela-inicial");

let atual = 0;
let perguntaAtual;
let historiaFinal = "";

botaoIniciar.addEventListener('click', iniciaJogo);
botaoJogarNovamente.addEventListener('click', jogaNovamente);

function iniciaJogo() {
atual = 0;
historiaFinal = "";
telaInicial.style.display = 'none';
caixaResultado.classList.remove("mostrar");
mostraPergunta();
}

function mostraPergunta() {
if (atual >= perguntas.length) {
mostraResultado();
return;
}
perguntaAtual = perguntas[atual];
caixaPerguntas.textContent = perguntaAtual.enunciado;
caixaAlternativas.textContent = "";
mostraAlternativas();
}

function mostraAlternativas() {
for (const alternativa of perguntaAtual.alternativas) {
const botaoAlternativas = document.createElement("button");
botaoAlternativas.textContent = alternativa.texto;
botaoAlternativas.addEventListener("click", () => respostaSelecionada(alternativa));
caixaAlternativas.appendChild(botaoAlternativas);
}
}

function respostaSelecionada(opcaoSelecionada) {
const afirmacoes = aleatorio(opcaoSelecionada.afirmacao);
historiaFinal += afirmacoes + " ";
if (opcaoSelecionada.proxima !== undefined) {
atual = opcaoSelecionada.proxima;
} else {
mostraResultado();
return;
}
mostraPergunta();
}

function mostraResultado() {
caixaPerguntas.textContent = `Em 2049, ${nome}`;
textoResultado.textContent = historiaFinal;
caixaAlternativas.textContent = "";
caixaResultado.classList.add("mostrar");
}

function jogaNovamente() {
atual = 0;
historiaFinal = "";
caixaResultado.classList.remove("mostrar");
mostraPergunta();
}

function substituiNome() {
for (const pergunta of perguntas) {
pergunta.enunciado = pergunta.enunciado.replace(/você/g, nome);
}
}

substituiNome();
</script>
</body>
</html>
